  # 家用风扇 / 风扇灯示例（fan 服务支持 ``fan.`` 域实体）：
  #   ``switch`` 服务负责风扇的开关（switch 适配器已支持 fan 域），
  #   ``fan`` 服务负责档位（gear_percent 把华为档位映射到 HA 的
  #   percentage）与摇头（direction/oscillating）。
  #   注意：华为物模型中的 fan 服务多来自空调类产品，prod_id 需替换为
  #   华为 IoT 目录中真实存在且含 fan 服务的产品号，否则可能触发 15013。
  # fan_light_leishi:
  #   product:
  #     prod_id: REPLACE_WITH_FAN_CATALOG_PRODID
  #     sub_prod_id: "00"
  #     device_type: REPLACE_WITH_DEVICE_TYPE
  #     manufacturer: "002"
  #     model: REPLACE_WITH_MODEL
  #     friendly_name: 家用风扇灯
  #     room: 客厅
  #     protocol_type: 6
  #     setup_type: 0
  #     known_fields_only: false
  #     services:
  #       - st: switch
  #         sid: switch
  #       - st: fan
  #         sid: fan
  #         contract:
  #           gear_percent:
  #             1: 30
  #             2: 60
  #             3: 100
  #           direction_enabled: false
  #   bindings:
  #     - sid: switch
  #       entities: [fan.REPLACE_WITH_FAN]
  #     - sid: fan
  #       entities: [fan.REPLACE_WITH_FAN]
  #
  #   如果 Profile 的 fan 服务使用数值 speed（例如 1..32 档），而不是 gear：
  #     contract:
  #       gear_enabled: false
  #       speed_enabled: true
  #       speed_min: 1
  #       speed_max: 32
  #   如果摇头使用 angle 特性（0 固定 / 1 摇头，或 0 / 90 度）：
  #     contract:
  #       direction_enabled: false
  #       angle_enabled: true
  #       angle_on: 90
  #       angle_off: 0

  # 电视 / 媒体播放器示例（只覆盖开关、静音、音量）：
  #   ``switch``   服务负责电源（switch 适配器已支持 media_player 域）；
  #   ``volSwitch``服务负责静音（由 media_player 适配器处理）；
  #   ``volume``   服务负责 0..100 音量。
  #   以下 prod_id 仅说明 Profile 形态，请替换为华为 IoT 目录中真实存在、
  #   且同时包含所选服务的产品号，否则可能触发 15013。
